[project]
name = "Recommendation-Engine"
version = "0.2.0"
description = "Local-first hybrid vector recommendation engine for media libraries"
requires-python = ">=3.11"
dependencies = [
    "FlagEmbedding>=1.3.5",
    "anthropic>=0.50.0",
    "langchain-core>=0.3.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
recommend = "src.cli.cli:cli"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
src = ["backend/src", "gui/src"]
line-length = 120
target-version = "py311"
exclude = [
    "notebooks/",
    "docs/*.md",
    "docs/notebooks/",
    "site/",
    "vendor/",
    "submodules/",
    "archive/python/",
]
force-exclude = true

[tool.ruff.lint]
# Ignore E501 (line length) for notebooks specifically if they are messy
ignore = ["E501", "E741", "SIM118"]
select = ["B", "C90", "E", "F", "I", "W", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Ignore F401 (unused import) for __init__.py files
"__init__.py" = ["F401"]

[tool.mypy]
# Permissive baseline — warnings only, no CI failures yet (§5.5A).
# Tighten incrementally: enable disallow_untyped_defs per-module once
# annotations are added to a module.
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# Per-module overrides — gradually opt in to stricter checking
[[tool.mypy.overrides]]
module = ["backend.src.errors", "backend.src.models.base"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode = "auto"  # Uncomment after installing pytest-asyncio
