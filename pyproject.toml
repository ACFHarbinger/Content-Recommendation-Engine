[project]
name = "recommendation-engine"
version = "0.1.0"
description = "Local-first hybrid vector recommendation engine for media libraries"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.9.0",
    "FlagEmbedding>=1.3.5",
    "anthropic>=0.50.0",
    "langchain-core>=0.3.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
recommend = "src.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
