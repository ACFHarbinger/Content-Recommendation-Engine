# GitLab CI/CD Pipeline
# Native-syntax translation of the GitHub Actions workflows under .github/workflows/:
# ci.yml, docs.yml.

stages:
  - test
  - docs

# ==========================================
# STAGE: TEST (ci.yml)
# ==========================================
lint:
  stage: test
  image: python:3.11
  script:
    - pip install uv
    - uv pip install --system ruff
    - ruff check .
    - ruff format --check .

test:
  stage: test
  image: python:3.11
  script:
    - pip install uv
    - uv pip install --system -e ".[dev]"
    - uv run pytest

# ==========================================
# STAGE: DOCS (docs.yml)
# ==========================================
# This special job name "pages" is required by GitLab to deploy to GitLab Pages.
pages:
  stage: docs
  image: python:3.11
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "docs/**/*"
        - "mkdocs.yml"
  script:
    - apt-get update && apt-get install -y --no-install-recommends nodejs npm
    - pip install uv
    - uv pip install --system mkdocs-material mkdocstrings[python]
    - mkdocs build --config-file docs/mkdocs.yml --strict --site-dir site
    - cd docs/website && npm ci && SITE_BASE=/app/ npm run build && cd ../..
    - mkdir -p site/app && cp -r docs/website/dist/. site/app/
    # GitLab Pages requires the output directory to be named "public"
    - mv site public
  artifacts:
    paths:
      - public
